<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Core palette from favicon -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080809"/>
      <stop offset="55%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#0d0f0e"/>
    </linearGradient>

    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3ecf8e" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="greenGlow">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Extremely subtle cinematic light -->
  <ellipse
    cx="1040"
    cy="80"
    rx="420"
    ry="300"
    fill="url(#greenGlow)"
  />

  <ellipse
    cx="1060"
    cy="90"
    rx="150"
    ry="120"
    fill="#3ecf8e"
    opacity=".035"
    filter="url(#softGlow)"
  />

  <!-- Subtle vignette -->
  <rect
    width="1200"
    height="630"
    fill="none"
    stroke="#000000"
    stroke-width="80"
    opacity=".18"
  />

  <!-- =====================================================
       SIGNATURE MOTIF
       A restrained interpretation of </> rather than
       simply displaying the favicon.
       ===================================================== -->

  <g transform="translate(1010 72)">

    <!-- tiny green point -->
    <circle
      cx="0"
      cy="0"
      r="3"
      fill="#3ecf8e"
    />

    <!-- signature line -->
    <path
      d="M 0 0
         C 42 0, 70 10, 92 30
         C 112 48, 130 58, 164 58"
      fill="none"
      stroke="#3ecf8e"
      stroke-width="1"
      opacity=".55"
    />

    <!-- subtle code-inspired marks -->
    <path
      d="M 112 38 L 128 58 L 112 78"
      fill="none"
      stroke="#3ecf8e"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity=".8"
    />

    <path
      d="M 145 38 L 129 78"
      fill="none"
      stroke="#3ecf8e"
      stroke-width="2"
      stroke-linecap="round"
      opacity=".55"
    />

  </g>

  <!-- =====================================================
       TOP MICRO IDENTITY
       ===================================================== -->

  <text
    x="82"
    y="78"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="4"
    fill="#3ecf8e"
  >
    &lt;/&gt;
  </text>

  <text
    x="125"
    y="78"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="2"
    fill="#666968"
  >
    PERSONAL PORTFOLIO
  </text>

  <!-- =====================================================
       MAIN IDENTITY
       ===================================================== -->

  <text
    x="82"
    y="280"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-3"
    fill="#f4f5f4"
  >
    Sehaj Varma
  </text>

  <!-- Accent underline / signature stroke -->
  <path
    d="M 84 306
       C 150 314, 235 313, 340 307
       C 405 303, 450 303, 495 305"
    fill="none"
    stroke="#3ecf8e"
    stroke-width="2"
    stroke-linecap="round"
    opacity=".9"
  />

  <!-- =====================================================
       ROLE
       ===================================================== -->

  <text
    x="84"
    y="365"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="24"
    font-weight="500"
    letter-spacing=".2"
    fill="#a7aaa8"
  >
    AI Automation Engineer
  </text>

  <text
    x="84"
    y="400"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="24"
    font-weight="500"
    letter-spacing=".2"
    fill="#a7aaa8"
  >
    &amp; Backend Developer
  </text>

  <!-- =====================================================
       CINEMATIC DIVIDER
       ===================================================== -->

  <rect
    x="84"
    y="452"
    width="1032"
    height="1"
    fill="url(#greenLine)"
  />

  <!-- tiny accent -->
  <circle
    cx="84"
    cy="452"
    r="2"
    fill="#3ecf8e"
  />

  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <text
    x="84"
    y="505"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="1.5"
    fill="#5f6361"
  >
    BUILDING SYSTEMS • AUTOMATION • INTELLIGENT SOFTWARE
  </text>

  <text
    x="1116"
    y="505"
    text-anchor="end"
    font-family="Inter, Helvetica, Arial, sans-serif"
    font-size="14"
    font-weight="500"
    fill="#3ecf8e"
  >
    bitbridge.work.gd
  </text>

  <!-- =====================================================
       SIGNATURE DOT
       ===================================================== -->

  <circle
    cx="1116"
    cy="552"
    r="3"
    fill="#3ecf8e"
  />

  <circle
    cx="1116"
    cy="552"
    r="3"
    fill="#3ecf8e"
    opacity=".25"
    filter="url(#tinyGlow)"
  />

</svg>
